[project]
name = "lawschatter-chatbot"
version = "1.0.0"
description = "法律聊天機器人 API 服務，基於 RAG 的法律問答系統"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "openai>=1.107.2",
]

[project.scripts]
chatbot-api = "main:main"

