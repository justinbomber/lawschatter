map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream frontend_app {
  server 127.0.0.1:3000;
}

upstream supabase_local {
  server 127.0.0.1:8000;
}

upstream rag_api {
  server 127.0.0.1:9500;
}

server {
  listen 443 ssl;
  server_name lawschatter.mooo.com;

  ssl_certificate /etc/letsencrypt/live/lawschatter.mooo.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/lawschatter.mooo.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # 前端 SPA／頁面
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    proxy_pass http://frontend_app;
  }

  # Supabase Auth 代理：/supabase-auth/* -> http://localhost:8000/auth/v1/*
  location /supabase-auth/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    proxy_pass http://supabase_local/auth/v1/;
  }

  # Supabase REST 代理：/supabase-rest/* -> http://localhost:8000/rest/v1/*
  location /supabase-rest/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    proxy_pass http://supabase_local/rest/v1/;
  }

  # Supabase Realtime（如需）/supabase-realtime/* -> http://localhost:8000/realtime/v1/*
  location /supabase-realtime/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://supabase_local/realtime/v1/;
  }

  # RAG／聊天 串流與非串流：/chat/* -> http://localhost:9500/chat/*
  location /chat/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE 最佳化
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering no;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    keepalive_timeout 3600s;

    proxy_pass http://rag_api;
  }

  # 其他 RAG 路徑（可選）：/rag/* 或 /search/* -> http://localhost:9500/*
  location /rag/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering no;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    keepalive_timeout 3600s;

    proxy_pass http://rag_api/;
  }

  location /search/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering no;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    keepalive_timeout 3600s;

    proxy_pass http://rag_api/;
  }
}

# 80 埠：強制轉向 HTTPS
server {
  if ($host = lawschatter.mooo.com) {
    return 301 https://$host$request_uri;
  }
  listen 80;
  server_name lawschatter.mooo.com;
  return 404;
}

# 額外需求：8090 埠號也轉到 3000（前端）
server {
  listen 8090;
  server_name lawschatter.mooo.com;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    proxy_pass http://frontend_app;
  }
}


