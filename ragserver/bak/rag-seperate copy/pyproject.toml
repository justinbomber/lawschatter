[project]
name = "qdrant-search-api"
version = "0.1.0"
description = "Qdrant 搜尋 API 服務，支援混合嵌入搜尋"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "qdrant-client>=1.15.0",
    "fastembed>=0.7.0",
    "jieba>=0.42.0",
    "langchain-qdrant>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "openai>=1.107.2",
    "pydantic>=2.5.0",
]

[project.scripts]
qdrant-api = "main:main"
